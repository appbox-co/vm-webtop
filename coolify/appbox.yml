# VM metadata; registration uses catalogue/register-admin-test-r9.sql.
# Do not run the Docker-only apps importer against this manifest.
app:
  display_name: Coolify VPS
  publisher: Coollabs
  description: |
    ## Deploy applications on your own VPS

    Coolify manages application deployments, databases and services inside an Ubuntu 26.04 virtual machine.

    ### Getting started

    Sign in with the administrator email and password chosen during installation. Add each project hostname to this VM in Appbox and configure the same hostname in Coolify.

    ### Updates and backups

    This admin-only preview uses Coolify 4.3.23. Automatic updates are disabled while the package is tested. Back up the VM and `/data/coolify` before making changes.
  admin_only: true
  categories: [16, 27, 29]
  type: vm
image:
  name: coolify-ubuntu-26.04-4.3.23-9a167fb96027.qcow2
  version: 4.3.23 / Ubuntu 26.04 r9
  tag: 4.3.23-ubuntu26.04-9a167fb
  sha256: 7ec41dec5245e70908aa6f8900f50d751838a16e71950993cf5ee6573a963d52
  source_commit: 9a167fb96027cd61e1dc4c8c48a04003d2358312
container:
  memory: 8
  memory_swap: 8
  memory_reservation: 8
  cpus: 4
networking:
  is_web_app: true
  requires_domain: true
  ssl: true
  tcp_passthrough: true
  multiple_domains: true
  subdomain: coolify
behavior:
  app_slots: 8
  allow_multiple: true
  expect_callback: true
  callback_requires_auth: true
  can_update: false
ports:
  tcp:
    range: '22'
env:
  - key: VIRTUAL_PORT
    value: '80'
    template_type: none
custom_fields:
  COOLIFY_ADMIN_EMAIL:
    label: Administrator email
    type: email
    validate: [required, {minLength: 3}, {maxLength: 254}]
    params: {showOnInstalled: true}
  PASSWORD:
    label: Administrator and SSH password
    type: complexPassword
    validate: [required, {minLength: 12}, {maxLength: 72}]
    sensitive: true
    revealable: true
    params: {showOnInstalled: true}
  LOGIN_USER:
    label: SSH username
    type: staticText
    default_value: appbox
    params: {showOnInstalled: true}
  SERVER_ADDR:
    label: SSH host
    type: staticText
    default_value: '%DOMAIN.DOMAIN%'
    template_type: instance
    params: {showOnInstalled: true}
  SSH_PORT:
    label: SSH port
    type: staticText
    default_value: '%PORTS|0.EXTERNAL%'
    template_type: instance
    params: {showOnInstalled: true}
  URL:
    label: Web UI
    type: externalURL
    default_value: 'https://%DOMAIN.DOMAIN%'
    template_type: instance
    params: {showOnInstalled: true}
