[Unit]
# The generic callback is enabled under multi-user.target, while cloud-final
# runs after that target. Keep this late callback from holding the target back.
DefaultDependencies=no
Requires=appbox-coolify.service
After=basic.target appbox-coolify.service
Conflicts=shutdown.target
Before=shutdown.target
# A successful callback consumes its one-time token. Later boots skip the
# generic unit instead of retrying it with HTTP 401 indefinitely.
ConditionPathExists=!/var/lib/appbox-coolify/callback-complete

[Service]
ExecStartPost=/usr/local/lib/appbox-coolify/runtime.py callback-complete
