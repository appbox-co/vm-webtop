# Environment variables for Selkies desktop
XDG_SESSION_TYPE DEFAULT=x11
XDG_SESSION_CLASS DEFAULT=user
XDG_SESSION_DESKTOP DEFAULT=KDE
XDG_CURRENT_DESKTOP DEFAULT=KDE
DESKTOP_SESSION DEFAULT=plasma
KDE_FULL_SESSION DEFAULT=true
KDE_SESSION_VERSION DEFAULT=6
QT_QPA_PLATFORM DEFAULT=xcb
GDK_BACKEND DEFAULT=x11
XDG_DATA_DIRS DEFAULT=/var/lib/snapd/desktop:/var/lib/flatpak/exports/share:${HOME}/.local/share/flatpak/exports/share:/usr/local/share:/usr/share
# Audio configuration for snap applications
PULSE_RUNTIME_PATH DEFAULT=/run/user/1000/pulse
ALSA_CARD DEFAULT=pulse
